<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Levels — Beyond Infinity: Soloverse</title>

  <!-- Keep the existing global styles unchanged -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="ui-fix.css" />
  <link rel="stylesheet" href="levels.css" />
</head>

<body>
  <div id="levels-root">
    <div class="frame-photo-wrap levels-frame">

      <!-- These are invisible click areas over the buttons already drawn
           into the new background image. Their IDs are kept unchanged. -->
      <button id="btn-back" class="frame-hotspot top-hotspot back-hotspot"
              aria-label="Back" title="Back"></button>

      <button id="btn-settings" class="frame-hotspot top-hotspot settings-hotspot"
              aria-label="Settings" title="Settings"></button>

      <button id="btn-upgrade" class="frame-hotspot top-hotspot upgrade-hotspot"
              aria-label="Upgrade" title="Upgrade"></button>

      <!-- Actual level artwork. Each card is a separate transparent PNG,
           so the cards cannot be cropped by the background/frame. -->
      <div class="levels-grid" aria-label="Level selection">

        <button id="level-1" class="level-button" title="Level 1: The Moon"
                aria-label="Level 1: The Moon">
          <img src="assets/levels/cards/level1.png" alt="The Moon — Level 1">
        </button>

        <button id="level-2" class="level-button" title="Level 2: Mars"
                aria-label="Level 2: Mars">
          <img src="assets/levels/cards/level2.png" alt="Mars — Level 2">
        </button>

        <button id="level-3" class="level-button" title="Level 3: Venus"
                aria-label="Level 3: Venus">
          <img src="assets/levels/cards/level3.png" alt="Venus — Level 3">
        </button>

        <button id="level-4" class="level-button" title="Level 4: Mercury"
                aria-label="Level 4: Mercury">
          <img src="assets/levels/cards/level4.png" alt="Mercury — Level 4">
        </button>

        <button id="level-5" class="level-button" title="Level 5: Jupiter"
                aria-label="Level 5: Jupiter">
          <img src="assets/levels/cards/level5.png" alt="Jupiter — Level 5">
        </button>

        <button id="level-6" class="level-button" title="Level 6: Saturn"
                aria-label="Level 6: Saturn">
          <img src="assets/levels/cards/level6.png" alt="Saturn — Level 6">
        </button>

        <button id="level-7" class="level-button" title="Level 7: Uranus"
                aria-label="Level 7: Uranus">
          <img src="assets/levels/cards/level7.png" alt="Uranus — Level 7">
        </button>

        <button id="level-8" class="level-button" title="Level 8: Neptune"
                aria-label="Level 8: Neptune">
          <img src="assets/levels/cards/level8.png" alt="Neptune — Level 8">
        </button>

      </div>

    </div>
  </div>

  <!-- Keep your existing game/level logic if this file exists in your branch. -->
  <script src="levels.js"></script>
</body>
</html>
